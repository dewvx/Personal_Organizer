# ====================================================================
# Personal Organizer Production Docker Compose Architecture
# Multi-container: PostgreSQL 17 + Node.js Express + Nginx Reverse Proxy
# ====================================================================

services:
  # 1. Relational Database (PostgreSQL 17)
  postgres:
    image: postgres:17-alpine
    container_name: organizer_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-personal_organizer}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - organizer_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-personal_organizer}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Node.js Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: organizer_prod_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-personal_organizer}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be configured}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@personalorganizer.app}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - organizer_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 3. Nginx Reverse Proxy & Static SPA Serving
  nginx:
    image: nginx:1.27-alpine
    container_name: organizer_prod_proxy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
    networks:
      - organizer_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: organizer_prod_postgres_data
    driver: local
  uploads_data:
    name: organizer_prod_uploads_data
    driver: local

networks:
  organizer_network:
    name: organizer_prod_network
    driver: bridge
